name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        # these run in the autofix workflow on pull requests
        if: github.event_name == 'push'
        run: pnpm lint

      - name: Test types
        run: pnpm tsc --noEmit

      - name: Sync
        run: pnpm sync --fail-on-archived
        # these run in the autofix workflow on pull requests
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Sync Status
        # these run in the autofix workflow on pull requests
        if: github.event_name == 'push'
        run: git diff --exit-code

      - name: Build
        run: pnpm build
