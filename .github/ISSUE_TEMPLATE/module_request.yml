name: Module Listing Request
description: Request to add a module you don't maintain to the modules list
title: '[Module Listing Request]: `...`'
labels: ['module-request']
body:
  - type: markdown
    attributes:
      value: |
        If you maintain the module, please open a pull request instead. You don't need an issue first:

        ```bash
        pnpm sync <name> <org>/<repo>
        ```

        See the [contribution guide](https://github.com/nuxt/modules#contribution) for details.

        If the module mainly loads a third-party script (analytics, chat widget, consent manager, captcha, ads), check [Nuxt Scripts](https://scripts.nuxt.com/scripts) first.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain in a few sentences what your module does.
      placeholder: This module is a wrapper for...
    validations:
      required: true
  - type: input
    id: repository-link
    attributes:
      label: Repository
      description: Drop a link to the source repository.
      placeholder: 'https://github.com/...'
    validations:
      required: true
  - type: input
    id: npm-link
    attributes:
      label: npm
      description: Drop a link to the npm package.
      placeholder: 'https://www.npmjs.com/package/...'
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Nuxt Compatibility
      description: What version of Nuxt is the module compatible with?
      multiple: true
      options:
        - Nuxt 2
        - Nuxt Bridge
        - Nuxt 3
        - Nuxt 4
    validations:
      required: true
