website: https://openreceive.org/integrations/nuxt
learn_more: https://openreceive.org
category: Ecommerce & Payments
type: 3rd-party
maintainers:
  - name: OpenReceive
    github: OpenReceive
compatibility:
  nuxt: ^4.0.0
  requires: {}
