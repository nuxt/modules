name: fonts
description: Add custom web fonts with performance in mind.
repo: nuxt/fonts
npm: '@nuxt/fonts'
icon: nuxt.svg
github: https://github.com/nuxt/fonts
website: https://nuxt.com/modules/fonts
learn_more: ''
category: Icons & Fonts
type: official
maintainers:
  - name: Daniel Roe
    github: danielroe
    twitter: danielcroe
    bluesky: danielroe.dev
compatibility:
  nuxt: '>=3.0.0'
  requires: {}
providers:
  - name: local
    label: Local
    docs: https://nuxt.com/modules/fonts/providers#local
  - name: google
    label: Google Fonts
    icon: simple-icons:googlefonts
    docs: https://nuxt.com/modules/fonts/providers#google
  - name: googleicons
    label: Google Fonts Icons
    icon: simple-icons:materialdesign
    docs: https://nuxt.com/modules/fonts/providers#googleicons
  - name: bunny
    label: Bunny Fonts
    icon: simple-icons:bunnydotnet
    docs: https://nuxt.com/modules/fonts/providers#bunny
  - name: fontshare
    label: Fontshare
    docs: https://nuxt.com/modules/fonts/providers#fontshare
  - name: fontsource
    label: Fontsource
    docs: https://nuxt.com/modules/fonts/providers#fontsource
  - name: npm
    label: npm
    icon: simple-icons:npm
    docs: https://nuxt.com/modules/fonts/providers#npm
  - name: adobe
    label: Adobe Fonts
    icon: logos:adobe-icon
    docs: https://nuxt.com/modules/fonts/providers#adobe
