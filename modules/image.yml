name: image
description: >-
  Add images with progressive processing, lazy-loading, resizing and providers
  support.
repo: nuxt/image
npm: '@nuxt/image'
icon: nuxt.svg
github: https://github.com/nuxt/image
website: https://image.nuxt.com
learn_more: ''
category: Images & Media
type: official
maintainers:
