    github: farnabaz
    twitter: a_birang
    bluesky: farnabaz.dev
  - name: Daniel Roe
    github: danielroe
    twitter: danielcroe
    bluesky: danielroe.dev
  - name: Pooya Parsa
    github: pi0
    twitter: _pi0_
    bluesky: pi0.io
  - name: Sébastien Chopin
    github: Atinux
    twitter: atinux
    bluesky: atinux.com
compatibility:
  nuxt: '>=3.1.0'
  requires:
    bridge: optional
mcp: https://image.nuxt.com/mcp
